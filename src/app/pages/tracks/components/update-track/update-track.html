<mat-card class="track-card">
  <div class="panel-title">
    <div>
      <span>Editar circuito</span>
      <h2>{{ data.name }}</h2>
    </div>
    <mat-icon>edit_road</mat-icon>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="track-form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Autodromo de Monza" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Pais</mat-label>
      <input matInput formControlName="country" placeholder="Italia" />
    </mat-form-field>

    <div class="upload-card">
      <div class="preview">
        @if(preview) {
        <img [src]="preview" alt="Vista previa del circuito" />
        } @else {
        <mat-icon>map</mat-icon>
        }
      </div>

      <div class="upload-copy">
        <strong>Imagen del circuito</strong>
        <label class="file-button">
          <mat-icon>upload</mat-icon>
          Cambiar imagen
          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        </label>
      </div>
    </div>

    <button mat-flat-button color="primary" [disabled]="loading || form.invalid">
      @if(loading) {
      <mat-progress-spinner diameter="20" mode="indeterminate" />
      } @else {
      <mat-icon>save</mat-icon>
      }
      Guardar cambios
    </button>
  </form>
</mat-card>
