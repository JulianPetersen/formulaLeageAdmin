<h2 mat-dialog-title>Editar carrera</h2>
<mat-dialog-content>
  <app-race-form [race]="data" [saving]="loading" [blocked]="blocked" [error]="error"
    (saveRace)="submit($event)" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="loading" (click)="dialogRef.close('refresh')">
    {{ blocked ? 'Volver y actualizar listado' : 'Cancelar' }}
  </button>
</mat-dialog-actions>
